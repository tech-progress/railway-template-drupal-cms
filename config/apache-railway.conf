# Railway's edge replaces the forwarding headers a client sends: X-Real-IP is
# the client and X-Forwarded-For is "<client>, <edge address>", whose second
# entry varies between edge nodes. Drupal (Symfony) resolves that list right to
# left, so it would key its per-address login flood control on the edge. Pass
# Drupal only the client from X-Real-IP, and drop the headers Drupal does not
# need, so a client cannot steer the host, port or path prefix of generated
# URLs. A request without a valid X-Real-IP (from inside the project) has no
# X-Forwarded-For at all, and Drupal sees the connecting address.
RequestHeader unset Forwarded
RequestHeader unset X-Forwarded-Host
RequestHeader unset X-Forwarded-Port
RequestHeader unset X-Forwarded-Prefix
RequestHeader set X-Forwarded-For "expr=%{req:X-Real-IP}" "expr=%{req:X-Real-IP} =~ /^[0-9A-Fa-f:.]{2,45}$/"
RequestHeader unset X-Forwarded-For "expr=! %{req:X-Real-IP} =~ /^[0-9A-Fa-f:.]{2,45}$/"

ServerTokens Prod
ServerSignature Off
ServerName localhost

# drupal-start installs the site with Drush before Apache starts, so the web
# installer is never needed; on an installed site it answers with an error
# page that includes a backtrace. authorize.php serves Drupal's legacy
# update manager, which cannot change the code in this image.
<LocationMatch "^/core/(install|authorize)\.php">
  Require all denied
</LocationMatch>
